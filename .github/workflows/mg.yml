name: MobileGlues

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  # The Rust core must prove itself before any APK is built:
  # 1) cargo test (unit tests, including the regex-semantics ports)
  # 2) rsdiff: byte-for-byte equivalence against the ORIGINAL std::regex
  #    implementations over the committed corpus + measured benchmarks.
  #    A single mismatched byte fails the build.
  rust-core:
    name: Rust core (tests + diff vs std::regex)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: rsdiff-cargo-${{ runner.os }}-${{ hashFiles('MobileGlues/MobileGlues-cpp/rust/Cargo.toml') }}

      - name: Unit tests
        run: cargo test --manifest-path MobileGlues/MobileGlues-cpp/rust/Cargo.toml --release

      - name: Build host staticlib
        run: cargo build --release --manifest-path MobileGlues/MobileGlues-cpp/rust/Cargo.toml

      - name: Differential equivalence & benchmark
        run: |
          g++ -O2 -std=c++20 -o rsdiff tools/rsdiff/rsdiff.cpp \
            MobileGlues/MobileGlues-cpp/rust/target/release/libmobileglues_rs.a \
            -lpthread -ldl
          ./rsdiff tools/rsdiff/corpus | tee rsdiff_report.txt

      - name: Upload rsdiff report
        uses: actions/upload-artifact@v4
        with:
          name: rsdiff-report
          path: rsdiff_report.txt

  build:
    name: Build APK
    needs: rust-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # The runner image ships a preinstalled Android SDK with accepted
      # licenses. android-actions/setup-android@v3 is currently broken
      # upstream ("Failed to find package 'tools'" — that legacy package
      # no longer exists), so we use the preinstalled SDK directly.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build apk
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: mobileglues-apk
          path: app/build/outputs/apk/release/*.apk
